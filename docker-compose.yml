# 单条命令启动：docker compose up --build
# 访问地址：http://localhost:3000 （端口可用 PORT 环境变量 / 下方 ports 映射调整）
services:
  museum-label:
    build: .
    image: museum-label-typesetter:latest
    container_name: museum-label
    ports:
      # 宿主机端口:容器端口；如想改用 8080，可写 "8080:3000"
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
    volumes:
      # 依赖安装到此命名卷：随启动安装、容器重建后仍可复用
      - museum_label_node_modules:/usr/src/app/node_modules
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  museum_label_node_modules:
